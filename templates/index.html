<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🧕 Hijab Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 50px; background-color: #fdf6f0; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; margin-bottom: 30px; }
        .result { margin-top: 20px; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧕 Hijab Detection</h1>
        <form action="/detect" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <input type="file" name="file" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Detect Hijabs</button>
        </form>

        {% if result %}
        <div class="result alert alert-info mt-3 text-center">
            <h4>{{ result.message }}</h4>
            <hr>
            <img src="{{ image_path }}" class="img-fluid rounded" alt="Detected Image">
        </div>
        {% endif %}

    </div>
</body>
</html>
